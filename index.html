  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Componente da Loja de Camisetas (Com Carrossel de 3 Imagens)
    function CamisetaSection() {
      const [tamanho, setTamanho] = useState("G");
      const [quantidade, setQuantidade] = useState(1);
      const [currentImgIndex, setCurrentImgIndex] = useState(0);
      const [isGalleryOpen, setIsGalleryOpen] = useState(false);

      const imagensCamiseta = [
        "images/camisetaguardian.jpg",
        "images/camisetaguardian2.jpg",
        "images/camisetaguardian3.jpg"
      ];

      const numeroWhatsApp = "5543988043776";

      const handleComprarZap = () => {
        const qtd = quantidade || 1;
        const mensagem = `Olá Equipe PASSARO / Marco Brandfer, eu gostaria de adquirir (${qtd}) camiseta(s) oficial(is) no tamanho (${tamanho})`;
        const url = `https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(mensagem)}`;
        window.open(url, '_blank');
      };

      const handlePrevImg = () => {
        setCurrentImgIndex((prev) => (prev === 0 ? imagensCamiseta.length - 1 : prev - 1));
      };

      const handleNextImg = () => {
        setCurrentImgIndex((prev) => (prev === imagensCamiseta.length - 1 ? 0 : prev + 1));
      };

      useEffect(() => {
        if (!isGalleryOpen) return;

        const handleKeyDown = (e) => {
          if (e.key === "Escape") setIsGalleryOpen(false);
          if (e.key === "ArrowLeft") handlePrevImg();
          if (e.key === "ArrowRight") handleNextImg();
        };

        document.addEventListener("keydown", handleKeyDown);
        document.body.style.overflow = "hidden";

        return () => {
          document.removeEventListener("keydown", handleKeyDown);
          document.body.style.overflow = "";
        };
      }, [isGalleryOpen]);

      const tamanhos = ['P', 'M', 'G', 'GG', 'XGG'];

      return (
        <>
          <section className="max-w-6xl mx-auto my-14 px-4">
            <div className="relative overflow-hidden bg-gradient-to-br from-neutral-900 via-neutral-900 to-neutral-950 border border-neutral-800 rounded-3xl shadow-2xl">
              <div className="absolute -top-24 -left-24 w-72 h-72 bg-amber-500/5 rounded-full blur-3xl pointer-events-none"></div>

              <div className="px-6 pt-6 md:px-8 md:pt-8 flex items-center justify-between gap-4">
                <div>
                  <div className="text-[10px] font-black uppercase tracking-[0.28em] text-amber-500">
                    Merchandise Oficial PASSARO
                  </div>
                  <div className="text-xs text-neutral-500 mt-1">
                    The Guardian of Hidden Wisdom Collection
                  </div>
                </div>
                <div className="hidden sm:flex items-center gap-2 border border-amber-500/20 bg-amber-500/5 px-3 py-1.5 rounded-full">
                  <i data-lucide="sparkles" className="w-3.5 h-3.5 text-amber-400"></i>
                  <span className="text-[10px] font-bold uppercase tracking-wider text-amber-200">Arte Exclusiva</span>
                </div>
              </div>

              <div className="p-6 md:p-8 pt-5 md:pt-6 grid grid-cols-1 lg:grid-cols-[1.55fr_0.85fr] gap-7 lg:gap-9 items-start">

                {/* GALERIA PRINCIPAL — 4:5 para valorizar as artes verticais */}
                <div className="space-y-3">
                  <div className="relative group rounded-2xl overflow-hidden border border-neutral-700/70 bg-black shadow-2xl">
                    <button
                      type="button"
                      onClick={() => setIsGalleryOpen(true)}
                      className="relative block w-full aspect-[4/5] cursor-zoom-in overflow-hidden bg-black"
                      aria-label="Ampliar imagem da camiseta"
                    >
                      <img
                        src={imagensCamiseta[currentImgIndex]}
                        alt={`Camiseta Oficial PASSARO - Foto ${currentImgIndex + 1}`}
                        className="w-full h-full object-contain transition-transform duration-500 group-hover:scale-[1.025]"
                      />

                      <div className="absolute inset-x-0 bottom-0 h-28 bg-gradient-to-t from-black/75 via-black/20 to-transparent pointer-events-none"></div>

                      <div className="absolute left-4 bottom-4 flex items-center gap-2 bg-black/65 border border-white/10 backdrop-blur-md text-white px-3 py-2 rounded-full shadow-lg">
                        <i data-lucide="zoom-in" className="w-4 h-4 text-amber-400"></i>
                        <span className="text-[10px] font-bold uppercase tracking-wider">Toque para ampliar</span>
                      </div>

                      <div className="absolute right-4 bottom-4 bg-black/65 border border-white/10 backdrop-blur-md text-neutral-300 px-3 py-2 rounded-full text-[10px] font-mono">
                        {currentImgIndex + 1} / {imagensCamiseta.length}
                      </div>
                    </button>

                    <button
                      type="button"
                      onClick={handlePrevImg}
                      aria-label="Foto anterior"
                      className="absolute left-3 top-1/2 -translate-y-1/2 bg-black/70 hover:bg-amber-500 hover:text-black text-white p-3 rounded-full border border-white/10 transition backdrop-blur-md z-10 shadow-xl"
                    >
                      <i data-lucide="chevron-left" className="w-5 h-5"></i>
                    </button>

                    <button
                      type="button"
                      onClick={handleNextImg}
                      aria-label="Próxima foto"
                      className="absolute right-3 top-1/2 -translate-y-1/2 bg-black/70 hover:bg-amber-500 hover:text-black text-white p-3 rounded-full border border-white/10 transition backdrop-blur-md z-10 shadow-xl"
                    >
                      <i data-lucide="chevron-right" className="w-5 h-5"></i>
                    </button>
                  </div>

                  {/* Miniaturas reais em vez de apenas bolinhas */}
                  <div className="grid grid-cols-3 gap-2.5">
                    {imagensCamiseta.map((img, idx) => (
                      <button
                        key={idx}
                        type="button"
                        onClick={() => setCurrentImgIndex(idx)}
                        aria-label={`Ver foto ${idx + 1}`}
                        className={`relative aspect-[4/3] rounded-xl overflow-hidden border-2 bg-black transition-all ${
                          currentImgIndex === idx
                            ? 'border-amber-500 ring-2 ring-amber-500/20'
                            : 'border-neutral-800 opacity-60 hover:opacity-100 hover:border-neutral-600'
                        }`}
                      >
                        <img
                          src={img}
                          alt={`Miniatura ${idx + 1}`}
                          className="w-full h-full object-cover"
                        />
                        {currentImgIndex === idx && (
                          <div className="absolute top-1.5 right-1.5 w-5 h-5 rounded-full bg-amber-500 text-black flex items-center justify-center">
                            <i data-lucide="check" className="w-3 h-3"></i>
                          </div>
                        )}
                      </button>
                    ))}
                  </div>
                </div>

                {/* PAINEL DE COMPRA */}
                <div className="lg:sticky lg:top-24 space-y-5 bg-neutral-950/55 border border-neutral-800 rounded-2xl p-5 md:p-6 shadow-xl">
                  <div className="space-y-2">
                    <span className="inline-flex items-center gap-1.5 text-[10px] font-bold uppercase tracking-wider text-amber-500">
                      <i data-lucide="shirt" className="w-3.5 h-3.5"></i>
                      Edição Oficial
                    </span>
                    <h2 className="text-2xl md:text-3xl font-black text-white leading-tight tracking-tight">
                      CAMISETA <span className="text-amber-400">THE GUARDIAN OF HIDDEN WISDOM</span>
                    </h2>
                  </div>

                  <p className="text-xs md:text-sm text-neutral-400 leading-relaxed">
                    Camiseta oficial da banda PASSARO em malha 100% algodão de alta qualidade, estampa exclusiva com acabamento premium. Leve a energia e a imponência do metal com você.
                  </p>

                  <div className="border-y border-neutral-800 py-4">
                    <div className="text-[10px] uppercase tracking-wider text-neutral-500 font-bold mb-1">Valor</div>
                    <div className="text-3xl font-black text-white">
                      R$ 89,90
                    </div>
                    <span className="text-[11px] text-neutral-500">(via PIX ou Cartão)</span>
                  </div>

                  <div>
                    <label className="block text-[10px] font-bold uppercase tracking-wider text-amber-500 mb-2.5">
                      Escolha o Tamanho
                    </label>
                    <div className="grid grid-cols-5 gap-2">
                      {tamanhos.map((tam) => (
                        <button
                          key={tam}
                          type="button"
                          onClick={() => setTamanho(tam)}

                              ? 'bg-amber-500 text-black border-amber-400 shadow-lg shadow-amber-950'
                              : 'bg-neutral-900 text-white border-neutral-800 hover:border-neutral-600'

                        >
                          {tam}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label htmlFor="qtdCamiseta" className="block text-[10px] font-bold uppercase tracking-wider text-amber-500 mb-2.5">
                      Quantidade
                    </label>
                    <div className="inline-flex items-center bg-neutral-900 border border-neutral-800 rounded-xl overflow-hidden">
                      <button
                        type="button"
                        onClick={() => setQuantidade((q) => Math.max(1, q - 1))}
                        className="w-10 h-10 text-neutral-300 hover:bg-neutral-800 hover:text-white transition text-lg font-bold"
                        aria-label="Diminuir quantidade"
                      >
                        −
                      </button>
                      <input
                        type="number"
                        id="qtdCamiseta"
                        value={quantidade}
                        min="1"
                        max="10"
                        onChange={(e) => setQuantidade(Math.max(1, Math.min(10, parseInt(e.target.value) || 1)))}
                        className="w-12 h-10 bg-neutral-950 border-x border-neutral-800 text-white font-black text-center text-sm focus:outline-none"
                      />
                      <button
                        type="button"
                        onClick={() => setQuantidade((q) => Math.min(10, q + 1))}
                        className="w-10 h-10 text-neutral-300 hover:bg-neutral-800 hover:text-white transition text-lg font-bold"
                        aria-label="Aumentar quantidade"
                      >
                        +
                      </button>
                    </div>
                  </div>

                  <button
                    onClick={handleComprarZap}
                    className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-4 px-6 rounded-xl text-sm uppercase tracking-wider transition flex items-center justify-center gap-2 shadow-xl shadow-emerald-950/40"

                    <i data-lucide="message-circle" className="w-5 h-5"></i>
                    <span>Quero minha camiseta</span>
                  </button>

                  <div className="grid grid-cols-2 gap-2 text-center">
                    <div className="bg-neutral-900 border border-neutral-800 rounded-xl px-3 py-2.5">
                      <i data-lucide="shield-check" className="w-4 h-4 text-amber-500 mx-auto mb-1"></i>
                      <div className="text-[9px] uppercase font-bold tracking-wider text-neutral-400">Compra Direta</div>
                    </div>
                    <div className="bg-neutral-900 border border-neutral-800 rounded-xl px-3 py-2.5">
                      <i data-lucide="credit-card" className="w-4 h-4 text-amber-500 mx-auto mb-1"></i>
                      <div className="text-[9px] uppercase font-bold tracking-wider text-neutral-400">PIX ou Cartão</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* LIGHTBOX / GALERIA EM TELA CHEIA */}
          {isGalleryOpen && (
            <div
              className="fixed inset-0 z-[100] bg-black/95 backdrop-blur-xl flex items-center justify-center p-3 md:p-8"
              onClick={() => setIsGalleryOpen(false)}
            >
              <button
                type="button"
                onClick={() => setIsGalleryOpen(false)}
                aria-label="Fechar galeria"
                className="absolute top-4 right-4 md:top-6 md:right-6 z-20 bg-neutral-900/80 hover:bg-amber-500 hover:text-black text-white border border-neutral-700 p-3 rounded-full transition"
              >
                <i data-lucide="x" className="w-5 h-5"></i>
              </button>

              <div
                className="relative w-full h-full max-w-6xl mx-auto flex flex-col items-center justify-center"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="text-center mb-3">
                  <div className="text-[10px] text-amber-500 uppercase tracking-[0.25em] font-black">
                    PASSARO Official Merchandise
                  </div>
                  <div className="text-xs text-neutral-500 mt-1">
                    Foto {currentImgIndex + 1} de {imagensCamiseta.length}
                  </div>
                </div>

                <div className="relative flex-1 min-h-0 w-full flex items-center justify-center">
                  <img
                    src={imagensCamiseta[currentImgIndex]}
                    alt={`Camiseta Oficial PASSARO ampliada - Foto ${currentImgIndex + 1}`}
                    className="max-w-full max-h-full object-contain rounded-xl shadow-2xl"
                  />

                  <button
                    type="button"
                    onClick={handlePrevImg}
                    aria-label="Foto anterior"
                    className="absolute left-1 md:left-5 top-1/2 -translate-y-1/2 bg-black/75 hover:bg-amber-500 hover:text-black text-white border border-white/10 p-3 md:p-4 rounded-full transition shadow-xl"
                  >
                    <i data-lucide="chevron-left" className="w-6 h-6"></i>
                  </button>

                  <button
                    type="button"
                    onClick={handleNextImg}
                    aria-label="Próxima foto"
                    className="absolute right-1 md:right-5 top-1/2 -translate-y-1/2 bg-black/75 hover:bg-amber-500 hover:text-black text-white border border-white/10 p-3 md:p-4 rounded-full transition shadow-xl"
                  >
                    <i data-lucide="chevron-right" className="w-6 h-6"></i>
                  </button>
                </div>

                <div className="flex gap-2 mt-3">
                  {imagensCamiseta.map((img, idx) => (
                    <button
                      key={idx}
                      type="button"
                      onClick={() => setCurrentImgIndex(idx)}
                      className={`w-14 h-14 md:w-16 md:h-16 rounded-lg overflow-hidden border-2 bg-black transition ${
                        currentImgIndex === idx ? 'border-amber-500' : 'border-neutral-800 opacity-50 hover:opacity-100'
                      }`}
                    >
                      <img src={img} alt={`Miniatura ampliada ${idx + 1}`} className="w-full h-full object-cover" />
                    </button>
                  ))}
                </div>

                <div className="hidden md:block text-[10px] text-neutral-600 mt-3 font-mono">
                  ← → para navegar &nbsp; • &nbsp; ESC para fechar
                </div>
              </div>
            </div>
          )}
        </>
      );
    }

            await fetch(`${SHEETDB_URL}?sheet=Downloads`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ data: [{ song: trackId, date: today }] })
            });
          }
        } catch (err) {
          console.error("Erro ao registrar estatística de download:", err);
        }
      };

      const getRockAvatar = (name) => {
        const cleanName = encodeURIComponent(name.trim().toLowerCase());
        return `https://api.dicebear.com/7.x/bottts/svg?seed=${cleanName}&backgroundColor=000000,b91c1c,171717`;
      };

      const handleAddComment = async (e) => {
        e.preventDefault();
        if (!newComment.trim() || !userName.trim()) return;

        setIsSubmittingComment(true);
        const avatarUrl = getRockAvatar(userName);
        const today = new Date().toLocaleDateString('pt-BR');
        const commentObj = {
          name: userName,
          text: newComment,
          date: today,
          avatar: avatarUrl
        };

        try {
          if (SHEETDB_URL) {
            await fetch(`${SHEETDB_URL}?sheet=Comments`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ data: [commentObj] })
            });
          }
          setComments([commentObj, ...comments]);
          setNewComment('');
          setUserName('');
        } catch (err) {
          console.error("Erro ao postar comentário:", err);
        } finally {
          setIsSubmittingComment(false);
        }
      };

      const copyPixToClipboard = () => {
        navigator.clipboard.writeText(pixKey);
        setCopiedPix(true);
        setTimeout(() => setCopiedPix(false), 3000);
      };

      const handleShareApp = () => {
        const shareData = {
          title: 'PASSARO - Official Web App',
          text: 'Ouça os singles de Heavy Metal de PASSARO (Marco Brandfer), decifre os enigmas e baixe as músicas exclusivas!',
          url: window.location.href
        };

        if (navigator.share) {
          navigator.share(shareData).catch((err) => console.log('Erro ao compartilhar:', err));
        } else {
          navigator.clipboard.writeText(window.location.href);
          setCopiedShare(true);
          setTimeout(() => setCopiedShare(false), 3000);
        }
      };

      const copyLyricsToClipboard = () => {
        if (!selectedLyricsTrack || !selectedLyricsTrack.lyrics) return;
        const textToCopy = selectedLyricsTrack.lyrics[lyricsLang];
        navigator.clipboard.writeText(textToCopy);
        setCopiedLyrics(true);
        setTimeout(() => setCopiedLyrics(false), 2500);
      };

      const handleSolveRiddle1 = (e) => {
        e.preventDefault();
        if (selectedOptionRiddle1 === 'B') {
          setRiddleError('');
          setRiddleSuccessText('');
          setUnlockedTracks(prev => ({ ...prev, guardian: true }));
          setActiveRiddle(null);
          setShowGuardianCeremony(true);
        } else {
          setRiddleError(t('r1error'));
        }
      };

      const handleSolveRiddle2 = (e) => {
        e.preventDefault();
        if (!releaseAccess.rainingMission) {
          setRiddleError("O segundo Portal ainda permanece selado. Aguarde o próximo chamado.");
          return;
        }
        if (selectedOptionRiddle2 === 'B') {
          setRiddleError('');
          setRiddleSuccessText("Os Pergaminhos Antigos permanecem nas mãos do Guardião. Você provou estar atento. Raining Tears foi desbloqueada!");
          setUnlockedTracks(prev => ({ ...prev, raining_tears: true }));
        } else {
          setRiddleError("Resposta incorreta! Dica: leia atentamente a letra de The Guardian of Hidden Wisdom.");
        }
      };

      const handleSolveRiddle3 = (e) => {
        e.preventDefault();
        if (!releaseAccess.darkCloudsMission) {
          setRiddleError("Esta passagem ainda não foi revelada. Aguarde o próximo chamado.");
          return;
        }
        if (selectedOptionRiddle3 === 'C') {
          setRiddleError('');
          setRiddleSuccessText("Sua visão alcançou além do que foi mostrado. A última passagem foi aberta. Dark Clouds foi desbloqueada!");
          setUnlockedTracks(prev => ({ ...prev, dark_clouds: true }));
        } else {
          setRiddleError("Incorreto. Pense em quem está ouvindo, interpretando e atravessando cada Portal.");
        }
      };

      const closeRiddleModal = () => {
        setActiveRiddle(null);
        setRiddleError('');
        setRiddleSuccessText('');
        setSelectedOptionRiddle1('');
        setSelectedOptionRiddle2('');
        setSelectedOptionRiddle3('');

              <button

                  </div>
                </div>

                <div className={`mt-7 transition-all duration-1000 ${guardianCeremonyStage >= 2 ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-5'}`}>
                  <div className="text-[10px] md:text-xs font-black uppercase tracking-[0.35em] text-amber-500">
                    {t('firstSeal')}
                  </div>
                  <h2 className="mt-3 text-2xl md:text-4xl font-black uppercase tracking-tight text-white">
                    {t('guardianAllowed')}
                  </h2>
                </div>

                <div className={`mt-7 transition-all duration-1000 ${guardianCeremonyStage >= 3 ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-5'}`}>
                  <div className="h-px w-24 mx-auto bg-gradient-to-r from-transparent via-amber-500 to-transparent mb-6"></div>
                  <div className="text-neutral-500 text-[10px] uppercase tracking-[0.28em] font-bold mb-2">
                    {t('presents')}
                  </div>
                  <div className="text-xl md:text-3xl text-amber-300 font-black tracking-tight">
                    THE GUARDIAN OF HIDDEN WISDOM
                  </div>
                  <div className="mt-2 text-xs font-mono uppercase tracking-[0.22em] text-neutral-400">
                    Cycle I • Unlocked
                  </div>
                </div>

                <div className={`mt-9 transition-all duration-700 ${guardianCeremonyStage >= 4 ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-4 pointer-events-none'}`}>
                  <button
                    type="button"
                    onClick={enterGuardianCycle}
                    className="group inline-flex items-center justify-center gap-3 bg-gradient-to-r from-amber-600 via-amber-400 to-amber-600 hover:from-amber-500 hover:via-amber-300 hover:to-amber-500 text-black font-black uppercase tracking-[0.18em] text-xs md:text-sm px-8 py-4 rounded-full shadow-[0_0_35px_rgba(245,158,11,0.25)] transition"
                  >
                    <span>{t('enter')}</span>
                    <i data-lucide="arrow-down" className="w-4 h-4 group-hover:translate-y-1 transition-transform"></i>
                  </button>
                </div>

                {guardianCeremonyStage < 4 && (
                  <button
                    type="button"
                    onClick={() => setGuardianCeremonyStage(4)}
                    className="mt-7 text-[9px] uppercase tracking-[0.22em] text-neutral-700 hover:text-neutral-400 transition"
                  >
                    {t('advance')}
                  </button>
                )}
              </div>
            </div>
          )}

          {activeRiddle === 'riddle1' && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-neutral-900 border border-amber-500/40 w-full max-w-lg rounded-2xl p-6 space-y-5 shadow-2xl">
                <div className="flex justify-between items-center border-b border-neutral-800 pb-3">
                  <span className="text-xs font-bold uppercase text-amber-500 flex items-center gap-2">
                    <i data-lucide="shield-alert" className="w-4 h-4"></i> {t('r1Title')}
                  </span>
                  <button onClick={closeRiddleModal} className="text-neutral-400 hover:text-white">✕</button>
                </div>
                {!riddleSuccessText ? (
                  <form onSubmit={handleSolveRiddle1} className="space-y-4">
                    <p className="text-sm font-semibold text-neutral-200 leading-relaxed">
                      {t('r1q')}
                    </p>
                    <div className="space-y-2">
                      {[
                        { id: 'A', text: t('r1a') },
                        { id: 'B', text: t('r1b') },
                        { id: 'C', text: t('r1c') },
                        { id: 'D', text: t('r1d') }
                      ].map((opt) => (
                        <label key={opt.id} className={`flex items-center gap-3 p-3 rounded-xl border text-xs cursor-pointer transition ${selectedOptionRiddle1 === opt.id ? 'bg-amber-950/60 border-amber-500 text-white font-bold' : 'bg-neutral-950 border-neutral-800 text-neutral-300 hover:border-neutral-700'}`}>
                          <input type="radio" name="riddle1" value={opt.id} checked={selectedOptionRiddle1 === opt.id} onChange={(e) => setSelectedOptionRiddle1(e.target.value)} className="accent-amber-500" />
                          <span>{opt.text}</span>
                        </label>
                      ))}
                    </div>
                    {riddleError && <p className="text-xs text-red-500 font-bold">{riddleError}</p>}
                    <button type="submit" disabled={!selectedOptionRiddle1} className="w-full bg-amber-500 hover:bg-amber-400 text-black font-extrabold py-3 rounded-xl text-xs uppercase tracking-wider transition disabled:opacity-50">
                      {t('break1')}
                    </button>
                  </form>
                ) : (
                  <div className="space-y-4 text-center">
                    <div className="w-12 h-12 bg-amber-500/20 text-amber-500 rounded-full flex items-center justify-center mx-auto text-2xl">🔓</div>
                    <h3 className="font-extrabold text-lg text-white uppercase">Selo Quebrado!</h3>
                    <p className="text-xs text-neutral-300 leading-relaxed bg-neutral-950 p-4 rounded-xl border border-neutral-800">"{riddleSuccessText}"</p>
                    <button onClick={closeRiddleModal} className="w-full bg-amber-500 hover:bg-amber-400 text-black font-extrabold py-3 rounded-xl text-xs uppercase transition">Ouvir The Guardian Agora</button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* MODAL ENIGMA #2 */}
          {activeRiddle === 'riddle2' && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-neutral-900 border border-amber-500/40 w-full max-w-lg rounded-2xl p-6 space-y-5 shadow-2xl">
                <div className="flex justify-between items-center border-b border-neutral-800 pb-3">
                  <span className="text-xs font-bold uppercase text-amber-500 flex items-center gap-2"><i data-lucide="shield-alert" className="w-4 h-4"></i> Enigma de Desbloqueio #2</span>
                  <button onClick={closeRiddleModal} className="text-neutral-400 hover:text-white">✕</button>
                </div>
                {!riddleSuccessText ? (
                  <form onSubmit={handleSolveRiddle2} className="space-y-4">
                    <p className="text-sm font-semibold text-neutral-200 leading-relaxed">
                      "Nas sombras profundas, ele guarda a sabedoria que a humanidade esqueceu. 'He is the watchmen!' Mas o que o Guardião realmente protege em suas mãos?"
                    </p>
                    <div className="space-y-2">
                      {[
                        { id: 'A', text: 'A) Uma espada de ouro' },
                        { id: 'B', text: 'B) Pergaminhos Antigos (The Scrolls of Old)' },
                        { id: 'C', text: 'C) Uma coroa de prata' },
                        { id: 'D', text: 'D) O Trono de Ferro' }
                      ].map((opt) => (
                        <label key={opt.id} className={`flex items-center gap-3 p-3 rounded-xl border text-xs cursor-pointer transition ${selectedOptionRiddle2 === opt.id ? 'bg-amber-950/60 border-amber-500 text-white font-bold' : 'bg-neutral-950 border-neutral-800 text-neutral-300 hover:border-neutral-700'}`}>
                          <input type="radio" name="riddle2" value={opt.id} checked={selectedOptionRiddle2 === opt.id} onChange={(e) => setSelectedOptionRiddle2(e.target.value)} className="accent-amber-500" />
                          <span>{opt.text}</span>
                        </label>
                      ))}
                    </div>
                    {riddleError && <p className="text-xs text-red-500 font-bold">{riddleError}</p>}
                    <button type="submit" disabled={!selectedOptionRiddle2} className="w-full bg-amber-500 hover:bg-amber-400 text-black font-extrabold py-3 rounded-xl text-xs uppercase tracking-wider transition disabled:opacity-50">Quebrar o Segundo Selo</button>
                  </form>
                ) : (
                  <div className="space-y-4 text-center">
                    <div className="w-12 h-12 bg-amber-500/20 text-amber-500 rounded-full flex items-center justify-center mx-auto text-2xl">🔓</div>
                    <h3 className="font-extrabold text-lg text-white uppercase">Selo Quebrado!</h3>
                    <p className="text-xs text-neutral-300 leading-relaxed bg-neutral-950 p-4 rounded-xl border border-neutral-800">"{riddleSuccessText}"</p>
                    <button onClick={closeRiddleModal} className="w-full bg-amber-500 hover:bg-amber-400 text-black font-extrabold py-3 rounded-xl text-xs uppercase transition">Ouvir Raining Tears Agora</button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* MODAL ENIGMA #3 */}
          {activeRiddle === 'riddle3' && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-neutral-900 border border-amber-500/40 w-full max-w-lg rounded-2xl p-6 space-y-5 shadow-2xl">
                <div className="flex justify-between items-center border-b border-neutral-800 pb-3">
                  <span className="text-xs font-bold uppercase text-amber-500 flex items-center gap-2"><i data-lucide="shield-alert" className="w-4 h-4"></i> Enigma de Desbloqueio #3</span>
                  <button onClick={closeRiddleModal} className="text-neutral-400 hover:text-white">✕</button>
                </div>
                {!riddleSuccessText ? (
                  <form onSubmit={handleSolveRiddle3} className="space-y-4">
                    <p className="text-sm font-semibold text-neutral-200 leading-relaxed">
                      "Depois de testemunhar um mundo afogado em lágrimas, existe uma verdade que nenhum Guardião pode revelar por você. Quem precisa enxergar além das sombras para que a sabedoria realmente desperte?"
                    </p>
                    <div className="space-y-2">
                      {[
                        { id: 'A', text: 'A) Um rei acima dos homens' },
                        { id: 'B', text: 'B) O próprio Portal' },
                        { id: 'C', text: 'C) Você — o ouvinte e a sua consciência' },
                        { id: 'D', text: 'D) Uma antiga profecia' }
                      ].map((opt) => (
                        <label key={opt.id} className={`flex items-center gap-3 p-3 rounded-xl border text-xs cursor-pointer transition ${selectedOptionRiddle3 === opt.id ? 'bg-amber-950/60 border-amber-500 text-white font-bold' : 'bg-neutral-950 border-neutral-800 text-neutral-300 hover:border-neutral-700'}`}>
                          <input type="radio" name="riddle3" value={opt.id} checked={selectedOptionRiddle3 === opt.id} onChange={(e) => setSelectedOptionRiddle3(e.target.value)} className="accent-amber-500" />
                          <span>{opt.text}</span>
                        </label>
                      ))}
                    </div>
                    {riddleError && <p className="text-xs text-red-500 font-bold">{riddleError}</p>}
                    <button type="submit" disabled={!selectedOptionRiddle3} className="w-full bg-amber-500 hover:bg-amber-400 text-black font-extrabold py-3 rounded-xl text-xs uppercase tracking-wider transition disabled:opacity-50">Quebrar o Terceiro Selo</button>
                  </form>
                ) : (
                  <div className="space-y-4 text-center">
                    <div className="w-12 h-12 bg-amber-500/20 text-amber-500 rounded-full flex items-center justify-center mx-auto text-2xl">⚡</div>
                    <h3 className="font-extrabold text-lg text-white uppercase">Acesso Concedido!</h3>
                    <p className="text-xs text-neutral-300 leading-relaxed bg-neutral-950 p-4 rounded-xl border border-neutral-800">"{riddleSuccessText}"</p>
                    <button onClick={closeRiddleModal} className="w-full bg-amber-500 hover:bg-amber-400 text-black font-extrabold py-3 rounded-xl text-xs uppercase transition">Ouvir Dark Clouds Agora</button>
                  </div>
                )}
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<PassaroApp />);
  </script>
</body>
</html>
