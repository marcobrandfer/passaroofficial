                          required
                        />
                        <span className="text-xs text-neutral-300 font-medium">
                          {t('vipCheckLabel')}
                        </span>
                      </label>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-semibold text-neutral-400 mb-1">{t('vipNameLabel')}</label>
                        <input 
                          type="text" 
                          required 
                          value={vipName} 
                          onChange={(e) => setVipName(e.target.value)}
                          placeholder={t('vipNamePlaceholder')}
                          className="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-neutral-400 mb-1">{t('vipLocLabel')}</label>
                        <input 
                          type="text" 
                          required 
                          value={vipLocation} 
                          onChange={(e) => setVipLocation(e.target.value)}
                          placeholder={t('vipLocPlaceholder')}
                          className="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-semibold text-neutral-400 mb-1">{t('vipEmailLabel')}</label>
                        <input 
                          type="email" 
                          required 
                          value={vipEmail} 
                          onChange={(e) => setVipEmail(e.target.value)}
                          placeholder={t('vipEmailPlaceholder')}
                          className="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-neutral-400 mb-1">{t('vipIgLabel')}</label>
                        <input 
                          type="text" 
                          value={vipInstagram} 
                          onChange={(e) => setVipInstagram(e.target.value)}
                          placeholder="@seu_perfil"
                          className="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500"
                        />
                      </div>
                    </div>

                    <button 
                      type="submit" 
                      disabled={isSubmittingVip || !hasFollowedInstagram}
                      className="w-full bg-amber-500 hover:bg-amber-400 text-black font-extrabold py-3.5 rounded-xl text-sm transition uppercase tracking-wider disabled:opacity-50 disabled:cursor-not-allowed shadow-lg"
                    >
                      {isSubmittingVip ? t('vipSubmitting') : t('vipSubmitBtn')}
                    </button>
                  </form>
                </div>
              ) : (
                <div className="bg-neutral-950 border border-amber-500/30 p-5 rounded-xl text-center space-y-3">
                  <div className="w-12 h-12 bg-amber-500/10 rounded-full flex items-center justify-center mx-auto text-amber-500">
                    <i data-lucide="check-circle-2" className="w-7 h-7"></i>
                  </div>
                  <h3 className="text-lg font-bold text-amber-400">{t('vipActivatedTitle')}</h3>
                  <p className="text-xs text-neutral-300 max-w-md mx-auto leading-relaxed">
                    {t('vipActivatedDesc')}
                  </p>
                </div>
              )}
            </div>
          </section>

          {/* Support Section com Tradução Completa */}
          <section id="support" className="max-w-3xl mx-auto my-12 px-4 space-y-6">
            <div className="bg-neutral-900 border border-neutral-800 rounded-2xl p-6 md:p-8 space-y-6">
              <div className="text-center space-y-2">
                <div className="inline-flex items-center gap-2 text-amber-500 bg-amber-500/10 border border-amber-500/20 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider">
                  <i data-lucide="heart" className="w-3.5 h-3.5 fill-current"></i>
                  <span>1. {t('supportTitle')}</span>
                </div>
                <p className="text-xs text-neutral-300 leading-relaxed max-w-xl mx-auto">
                  {t('supportDesc')}
                </p>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {/* Ko-fi International */}
                <div className="bg-neutral-950 border border-neutral-800 p-5 rounded-xl flex flex-col justify-between space-y-4">
                  <div>
                    <span className="text-[10px] font-bold text-amber-500 uppercase tracking-wider">{t('intlSupportTitle')}</span>
                    <h3 className="font-bold text-base text-white mt-1">{t('intlSupportSub')}</h3>
                    <p className="text-xs text-neutral-400 mt-2 leading-relaxed">
                      {t('intlSupportDesc')}
                    </p>
                  </div>
                  <a 
                    href={socialLinks.kofi} 
                    target="_blank" 
                    rel="noopener noreferrer"
                    className="w-full bg-neutral-800 hover:bg-neutral-700 text-white font-bold py-2.5 rounded-xl text-xs transition border border-neutral-700 text-center flex items-center justify-center gap-2"
                  >
                    <i data-lucide="coffee" className="w-4 h-4 text-amber-500"></i>
                    <span>{t('intlSupportBtn')}</span>
                  </a>
                </div>

                {/* Pix Brasil */}
                <div className="bg-neutral-950 border border-neutral-800 p-5 rounded-xl flex flex-col justify-between space-y-4">
                  <div>
                    <span className="text-[10px] font-bold text-amber-500 uppercase tracking-wider">{t('brSupportTitle')}</span>
                    <h3 className="font-bold text-base text-white mt-1">{t('brSupportSub')}</h3>
                    <p className="text-xs text-neutral-400 mt-2 leading-relaxed">
                      {t('brSupportDesc')}
                    </p>
                    <div className="mt-3 bg-neutral-900 border border-neutral-800 p-2.5 rounded-lg text-xs font-mono text-amber-300 select-all text-center">
                      {pixKey}
                    </div>
                  </div>
                  <button 
                    onClick={copyPixToClipboard}
                    className="w-full bg-amber-500 hover:bg-amber-400 text-black font-extrabold py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-2 shadow-md"
                  >
                    <i data-lucide={copiedPix ? "check" : "copy"} className="w-4 h-4"></i>
                    <span>{copiedPix ? t('pixCopiedBtn') : t('pixCopyBtn')}</span>
                  </button>
                </div>
              </div>

              {/* Bloco de Compartilhamento Direto */}
              <div className="bg-neutral-950 border border-neutral-800 p-5 rounded-xl space-y-3">
                <span className="text-[10px] font-bold text-amber-500 uppercase tracking-wider">2. {t('share')}</span>
                <p className="text-xs text-neutral-300 leading-relaxed">
                  {t('spreadWordTitle')}
                </p>
                <button 
                  onClick={handleShareApp} 
                  className="w-full bg-neutral-800 hover:bg-neutral-700 text-amber-400 font-bold py-3 rounded-xl text-xs border border-neutral-700 transition flex items-center justify-center gap-2"
                >
                  <i data-lucide={copiedShare ? "check" : "share-2"} className="w-4 h-4"></i>
                  <span>{copiedShare ? t('copied') : t('shareAppBtn')}</span>
                </button>
              </div>
            </div>
          </section>

          {/* Mural dos Fãs & Comunidade com Tradução Completa */}
          <section className="max-w-3xl mx-auto my-12 px-4 space-y-6">
            <div className="bg-neutral-900 border border-neutral-800 rounded-2xl p-6 md:p-8 space-y-6">
              <div className="flex items-center gap-3 border-b border-neutral-800 pb-4">
                <i data-lucide="messages-square" className="text-amber-500 w-6 h-6"></i>
                <div>
                  <h2 className="text-xl md:text-2xl font-bold text-white">3. {t('fanWallTitle')}</h2>
                  <p className="text-xs text-neutral-400 mt-1">{t('fanWallSub')}</p>
                </div>
              </div>

              <form onSubmit={handleAddComment} className="space-y-4">
                <div>
                  <input 
                    type="text" 
                    required 
                    value={userName} 
                    onChange={(e) => setUserName(e.target.value)}
                    placeholder={t('fanNamePlaceholder')}
                    className="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500"
                  />
                </div>
                <div>
                  <textarea 
                    rows="3" 
                    required 
                    value={newComment} 
                    onChange={(e) => setNewComment(e.target.value)}
                    placeholder={t('fanCommentPlaceholder')}
                    className="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500"
                  ></textarea>
                </div>
                <button 
                  type="submit" 
                  disabled={isSubmittingComment}
                  className="bg-amber-500 hover:bg-amber-400 text-black font-extrabold px-6 py-3 rounded-xl text-xs uppercase tracking-wider transition disabled:opacity-50 flex items-center gap-2"
                >
                  <i data-lucide="send" className="w-4 h-4"></i>
                  <span>{isSubmittingComment ? t('publishingBtn') : t('publishBtn')}</span>
                </button>
              </form>

              <div className="space-y-4 pt-4 border-t border-neutral-800">
                {comments.length === 0 ? (
                  <p className="text-xs text-neutral-500 italic text-center py-4">{t('noCommentsYet')}</p>
                ) : (
                  comments.map((c, i) => (
                    <div key={i} className="bg-neutral-950 border border-neutral-800/80 p-4 rounded-xl space-y-2">
                      <div className="flex items-center justify-between">
                        <div className="flex items-center gap-2.5">
                          <img src={c.avatar || getRockAvatar(c.name || 'Fan')} alt="Avatar Fan" className="w-8 h-8 rounded-full bg-neutral-900 border border-neutral-800" />
                          <span className="font-bold text-xs text-amber-400">{c.name}</span>
                        </div>
                        <span className="text-[10px] font-mono text-neutral-500">{c.date}</span>
                      </div>
                      <p className="text-xs text-neutral-300 leading-relaxed pl-10">{c.text}</p>
                    </div>
                  ))
                )}
              </div>
            </div>
          </section>

          {/* Footer */}
          <footer className="text-center text-xs text-neutral-500 space-y-2 mt-16">
            <p>© {new Date().getFullYear()} PASSARO - Projeto de Heavy Metal Autoral por Marco Brandfer.</p>
            <p className="text-[10px] text-neutral-600">Todos os direitos reservados.</p>
          </footer>

          {/* Modal Riddle 1 */}
          {activeRiddle === 'riddle1' && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-neutral-900 border border-amber-500/40 max-w-lg w-full rounded-2xl p-6 space-y-5 shadow-2xl relative">
                <button 
                  onClick={closeRiddleModal}
                  className="absolute top-4 right-4 text-neutral-400 hover:text-white"
                >
                  <i data-lucide="x" className="w-5 h-5"></i>
                </button>

                <div className="space-y-2">
                  <span className="text-[10px] font-mono uppercase tracking-widest text-amber-500">{t('r1Title')}</span>
                  <h3 className="text-lg font-bold text-white">{t('r1q')}</h3>
                </div>

                <form onSubmit={handleSolveRiddle1} className="space-y-4">
                  <div className="space-y-2">
                    {[
                      { id: 'A', label: t('r1a') },
                      { id: 'B', label: t('r1b') },
                      { id: 'C', label: t('r1c') },
                      { id: 'D', label: t('r1d') }
                    ].map(opt => (
                      <label 
                        key={opt.id}
                        className={`block p-3 rounded-xl border text-xs cursor-pointer transition ${
                          selectedOptionRiddle1 === opt.id 
                            ? 'bg-amber-500/10 border-amber-500 text-amber-200' 
                            : 'bg-neutral-950 border-neutral-800 text-neutral-300 hover:border-neutral-700'
                        }`}
                      >
                        <input 
                          type="radio" 
                          name="riddle1" 
                          value={opt.id} 
                          checked={selectedOptionRiddle1 === opt.id}
                          onChange={(e) => setSelectedOptionRiddle1(e.target.value)}
                          className="hidden"
                        />
                        {opt.label}
                      </label>
                    ))}
                  </div>

                  {riddleError && (
                    <p className="text-xs text-red-400 bg-red-950/40 border border-red-900/50 p-3 rounded-xl leading-relaxed">
                      {riddleError}
                    </p>
                  )}

                  <button 
                    type="submit"
                    disabled={!selectedOptionRiddle1}
                    className="w-full bg-amber-500 hover:bg-amber-400 text-black font-extrabold py-3 rounded-xl text-xs uppercase tracking-wider transition disabled:opacity-50"
                  >
                    {t('break1')}
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Modal de Letras e Tradução */}
          {selectedLyricsTrack && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-neutral-900 border border-neutral-800 max-w-lg w-full rounded-2xl p-6 space-y-4 shadow-2xl relative max-h-[85vh] flex flex-col">
                <div className="flex justify-between items-center border-b border-neutral-800 pb-3">
                  <div>
                    <span className="text-[10px] uppercase font-bold text-amber-500">{selectedLyricsTrack.subtitle}</span>
                    <h3 className="font-bold text-lg text-white">{selectedLyricsTrack.title}</h3>
                  </div>
                  <button 
                    onClick={() => setSelectedLyricsTrack(null)}
                    className="text-neutral-400 hover:text-white"
                  >
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                <div className="flex items-center justify-between bg-neutral-950 p-1.5 rounded-xl border border-neutral-800">
                  <div className="flex gap-1">
                    <button 
                      onClick={() => setLyricsLang('en')}
                      className={`px-3 py-1 rounded-lg text-xs font-bold transition ${lyricsLang === 'en' ? 'bg-amber-500 text-black' : 'text-neutral-400 hover:text-white'}`}
                    >
                      English
                    </button>
                    <button 
                      onClick={() => setLyricsLang('pt')}
                      className={`px-3 py-1 rounded-lg text-xs font-bold transition ${lyricsLang === 'pt' ? 'bg-amber-500 text-black' : 'text-neutral-400 hover:text-white'}`}
                    >
                      Português
                    </button>
                  </div>
                  
                  <button 
                    onClick={copyLyricsToClipboard}
                    className="text-neutral-400 hover:text-amber-400 p-1.5 rounded-lg transition text-xs flex items-center gap-1 font-mono"
                  >
                    <i data-lucide={copiedLyrics ? "check" : "copy"} className="w-3.5 h-3.5"></i>
                    <span>{copiedLyrics ? "Copiado" : "Copiar"}</span>
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto pr-2 space-y-2 text-xs md:text-sm text-neutral-300 leading-relaxed font-serif whitespace-pre-line bg-neutral-950/50 p-4 rounded-xl border border-neutral-800/50">
                  {selectedLyricsTrack.lyrics[lyricsLang]}
                </div>
              </div>
            </div>
          )}

          {/* Modal O Pergaminho do Olhar */}
          {activeScroll === 1 && (
            <div className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-neutral-900 border border-amber-500/40 max-w-xl w-full rounded-2xl p-6 md:p-8 space-y-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
                <button onClick={() => setActiveScroll(null)} className="absolute top-4 right-4 text-neutral-400 hover:text-white">
                  <i data-lucide="x" className="w-5 h-5"></i>
                </button>
                <div className="space-y-2 border-b border-amber-500/20 pb-4">
                  <div className="text-[10px] font-black uppercase tracking-[0.25em] text-amber-500">{t('scroll1')}</div>
                  <h3 className="text-2xl font-black text-white">{t('scroll1Name')}</h3>
                  <p className="text-xs text-amber-200/90 italic font-serif">{t('scroll1Quote')}</p>
                </div>
                <div className="space-y-3">
                  <div className="text-[10px] font-black uppercase tracking-[0.2em] text-neutral-400">{t('visionLabel')}</div>
                  <p className="text-xs md:text-sm text-neutral-300 leading-relaxed">{t('scroll1Body')}</p>
                </div>
                <div className="bg-neutral-950 border border-amber-500/20 p-4 rounded-xl space-y-2">
                  <div className="text-[10px] font-black uppercase tracking-[0.2em] text-amber-500">{t('questionLabel')}</div>
                  <p className="text-xs md:text-sm text-amber-100 font-medium italic">{t('scroll1Question')}</p>
                </div>
                <div className="text-right text-xs font-serif text-neutral-500 italic">{t('guardianSignature')}</div>
              </div>
            </div>
          )}

          {/* Cerimônia de Desbloqueio do Guardião */}
          {showGuardianCeremony && (
            <div className="fixed inset-0 z-[100] bg-black/95 backdrop-blur-2xl flex items-center justify-center p-4 sm:p-6 overflow-hidden">
              <div className="max-w-md w-full bg-neutral-950 border border-amber-500/50 rounded-3xl p-6 md:p-8 text-center space-y-6 shadow-[0_0_80px_rgba(245,158,11,0.25)] relative">
                <div className="space-y-2">
                  <span className={`inline-block text-[10px] font-black uppercase tracking-[0.3em] text-amber-500 transition-all duration-700 ${guardianCeremonyStage >= 1 ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-3'}`}>
                    {t('firstSeal')}
                  </span>
                  <h2 className={`text-2xl md:text-3xl font-black text-white uppercase tracking-tight transition-all duration-700 delay-150 ${guardianCeremonyStage >= 1 ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-3'}`}>
                    The Guardian of Hidden Wisdom
                  </h2>
                  <p className={`text-xs text-neutral-400 transition-all duration-700 delay-300 ${guardianCeremonyStage >= 2 ? 'opacity-100' : 'opacity-0'}`}>
                    {t('guardianAllowed')}
                  </p>
                </div>

                <div className={`relative mx-auto w-48 h-48 md:w-56 md:h-56 rounded-2xl overflow-hidden border-2 border-amber-500 shadow-2xl transition-all duration-1000 ${guardianCeremonyStage >= 2 ? 'opacity-100 scale-100' : 'opacity-0 scale-90'}`}>
                  <img src="./images/capaguardian.jpg" alt="The Guardian" className="w-full h-full object-cover" />
                  <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"></div>
                </div>

                <div className={`space-y-4 transition-all duration-700 ${guardianCeremonyStage >= 3 ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-4'}`}>
                  <div className="text-[10px] font-mono text-amber-400 uppercase tracking-widest">{t('presents')}</div>
                  <p className="text-xs text-neutral-300 italic font-serif leading-relaxed px-2">
                    “{t('scroll1Quote')}”
                  </p>
                  <button onClick={enterGuardianCycle} className="w-full bg-gradient-to-r from-amber-500 to-amber-400 hover:from-amber-400 hover:to-amber-300 text-black font-black py-3.5 rounded-xl text-xs uppercase tracking-wider transition shadow-xl flex items-center justify-center gap-2">
                    <span>{t('enter')}</span>
                    <i data-lucide="arrow-right" className="w-4 h-4"></i>
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<PassaroApp />);
  </script>
</body>
</html>
