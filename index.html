        const shareData = {
          title: 'PASSARO - Official Web App',
          text: 'Ouça os singles de Heavy Metal de PASSARO (Marco Brandfer), decifre os enigmas e baixe as músicas exclusivas!',
          url: window.location.href
        };

        if (navigator.share) {
          navigator.share(shareData).catch((err) => console.log('Erro ao compartilhar:', err));
        } else {
          navigator.clipboard.writeText(window.location.href);
          setCopiedShare(true);
          setTimeout(() => setCopiedShare(false), 3000);
        }
      };

      const copyLyricsToClipboard = () => {
        if (!selectedLyricsTrack || !selectedLyricsTrack.lyrics) return;
        const textToCopy = selectedLyricsTrack.lyrics[lyricsLang];
        navigator.clipboard.writeText(textToCopy);
        setCopiedLyrics(true);
        setTimeout(() => setCopiedLyrics(false), 2500);
      };

      const handleSolveRiddle1 = (e) => {
        e.preventDefault();
        if (selectedOptionRiddle1 === 'B') {
          setRiddleError('');
          setRiddleSuccessText("Você compreendeu o primeiro sinal. O Portal não guarda a verdade sozinho — existe alguém que vigia a passagem. The Guardian of Hidden Wisdom foi desbloqueada!");
          setUnlockedTracks(prev => ({ ...prev, guardian: true }));
        } else {
          setRiddleError("Resposta incorreta. Pense em quem permanece entre o buscador e a sabedoria, decidindo quem pode cruzar a linha.");
        }
      };

      const handleSolveRiddle2 = (e) => {
        e.preventDefault();
        if (selectedOptionRiddle2 === 'B') {
          setRiddleError('');
          setRiddleSuccessText("Os Pergaminhos Antigos permanecem nas mãos do Guardião. Você provou estar atento. Raining Tears foi desbloqueada!");
          setUnlockedTracks(prev => ({ ...prev, raining_tears: true }));
        } else {
          setRiddleError("Resposta incorreta! Dica: leia atentamente a letra de The Guardian of Hidden Wisdom.");
        }
      };

      const handleSolveRiddle3 = (e) => {
        e.preventDefault();
        if (selectedOptionRiddle3 === 'C') {
          setRiddleError('');
          setRiddleSuccessText("Sua visão alcançou além do que foi mostrado. A última passagem foi aberta. Dark Clouds foi desbloqueada!");
          setUnlockedTracks(prev => ({ ...prev, dark_clouds: true }));
        } else {
          setRiddleError("Incorreto. Pense em quem está ouvindo, interpretando e atravessando cada Portal.");
        }
      };

      const closeRiddleModal = () => {
        setActiveRiddle(null);
        setRiddleError('');
        setRiddleSuccessText('');
        setSelectedOptionRiddle1('');
        setSelectedOptionRiddle2('');
        setSelectedOptionRiddle3('');
      };

      return (
        <div className="min-h-screen relative">
          
          <audio 
            ref={audioRef} 
            onTimeUpdate={handleTimeUpdate} 
            onEnded={() => { setCurrentPlayingId(null); setCurrentTime(0); }}
          ></audio>

          {/* Sticky Header */}
          <header className="sticky top-0 z-40 bg-neutral-900/90 backdrop-blur-md border-b border-neutral-800 px-4 py-3 flex justify-between items-center">
            <div className="flex items-center gap-2">
              <i data-lucide="disc" className="w-6 h-6 text-amber-500 animate-spin"></i>
              <span className="font-extrabold tracking-wider text-lg uppercase bg-gradient-to-r from-amber-200 via-amber-400 to-amber-600 bg-clip-text text-transparent">
                PASSARO <span className="text-amber-500 text-xs px-2 py-0.5 border border-amber-500 rounded-full font-mono">OFFICIAL</span>
              </span>
            </div>
            
            <div className="flex items-center gap-3">
              <button 
                onClick={handleShareApp} 
                className="text-neutral-300 hover:text-white bg-neutral-800 hover:bg-neutral-700 border border-neutral-700/60 px-3 py-1.5 rounded-full text-xs font-bold transition flex items-center gap-1.5"
                title="Compartilhar Web App"
              >
                <i data-lucide={copiedShare ? "check" : "share-2"} className="w-3.5 h-3.5 text-amber-500"></i>
                <span className="hidden sm:inline">{copiedShare ? 'Link Copiado!' : 'Compartilhar'}</span>
              </button>

              <a href={socialLinks.instagram} target="_blank" rel="noopener noreferrer" className="text-neutral-400 hover:text-white transition flex items-center gap-1">
                <i data-lucide="instagram" className="w-5 h-5 text-amber-500"></i>
                <span className="hidden md:inline text-xs font-semibold">@passaroofficial</span>
              </a>
              <a href={socialLinks.youtube} target="_blank" rel="noopener noreferrer" className="text-neutral-400 hover:text-red-500 transition">
                <i data-lucide="youtube" className="w-5 h-5 text-red-500"></i>
              </a>
              <a href="#support" className="text-xs bg-amber-600 hover:bg-amber-500 text-black font-extrabold px-3 py-1.5 rounded-full transition ml-1">
                Apoiar
              </a>
            </div>
          </header>

          {/* Decifre os Enigmas Ocultos */}
          <section className="max-w-5xl mx-auto my-12 px-4 space-y-6">
            <div className="text-center space-y-2">
              <div className="text-[10px] uppercase tracking-[0.3em] font-bold text-amber-500 mb-2">Você atravessou a linha</div>
              <h1 className="text-3xl font-black uppercase tracking-tight text-white">Decifre os Enigmas de PASSARO</h1>
              <p className="text-xs text-neutral-400 max-w-xl mx-auto leading-relaxed">
                <strong className="text-amber-500">Tzipor - Ha-Shomer</strong> é a primeira passagem. Ouça cada faixa, acompanhe as letras e decifre os ENIGMAS para quebrar os selos das próximas músicas.
              </p>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
              {tracks.map((track, idx) => {
                const isUnlocked = unlockedTracks[track.id];
                const isThisPlaying = currentPlayingId === track.id;
                const count = downloadCounts[track.id] || 0;

                return (
                  <div 
                    key={track.id} 
                    className={`bg-neutral-900 border rounded-2xl overflow-hidden flex flex-col justify-between shadow-xl transition relative ${
                      isUnlocked 
                        ? 'border-neutral-800 hover:border-amber-500/50' 
                        : 'border-amber-900/40 bg-neutral-950/90'
                    }`}
                  >
                    {!isUnlocked && (
                      <div className="absolute top-3 right-3 z-10 bg-amber-500/20 border border-amber-500/40 backdrop-blur-md px-2.5 py-1 rounded-full flex items-center gap-1 shadow-lg">
                        <i data-lucide="lock" className="w-3.5 h-3.5 text-amber-400"></i>
                        <span className="text-[10px] font-bold text-amber-300 uppercase">Selado</span>
                      </div>
                    )}

                    <div>
                      {/* Imagem de Capa */}
                      <div className="relative aspect-square overflow-hidden bg-neutral-950">
                        <img 
                          src={track.cover} 
                          alt={track.title} 
                          className={`w-full h-full object-cover group-hover:scale-105 transition duration-500 ${!isUnlocked ? 'filter blur-sm opacity-40' : ''}`}
                        />
                      </div>

                      <div className="p-4 space-y-3">
                        {/* Contador de Downloads */}
                        <div className="flex items-center gap-1.5 text-neutral-400 text-[11px] font-mono border-b border-neutral-800 pb-2">
                          <i data-lucide="download" className="w-3.5 h-3.5 text-amber-500"></i>
                          <span className="font-bold text-neutral-300">{count.toLocaleString('pt-BR')}</span> downloads realizados
                        </div>

                        <div className="flex justify-between items-start gap-2">
                          <div>
                            <span className="text-[10px] uppercase font-bold text-amber-500 tracking-wider">{track.subtitle}</span>
                            <h3 className="font-bold text-base text-white line-clamp-1">{track.title}</h3>
                          </div>
                          
                          {track.lyrics && (
                            <button 
                              onClick={() => { setSelectedLyricsTrack(track); setLyricsLang('en'); }}
                              title="Ver Letra e Tradução"
                              className="bg-neutral-800 hover:bg-neutral-700 text-neutral-300 p-2 rounded-xl transition flex items-center gap-1.5 border border-neutral-700/60 flex-shrink-0"
                            >
                              <i data-lucide="file-text" className="w-4 h-4 text-amber-500"></i>
                              <span className="text-[10px] font-bold">Letra</span>
                            </button>
                          )}
                        </div>

                        {isUnlocked ? (
                          <div className="bg-neutral-950/80 border border-neutral-800/80 rounded-xl p-3 space-y-2">
                            <div className="flex items-center gap-3">
                              <button 
                                onClick={() => togglePlayTrack(track.id, track.audioPreview)}
                                aria-label={isThisPlaying ? "Pausar" : "Tocar"}
                                className="bg-amber-500 hover:bg-amber-400 text-black p-2.5 rounded-full transition flex-shrink-0 flex items-center justify-center shadow-md shadow-amber-950"
                              >
                                {isThisPlaying ? (
                                  <svg className="w-4 h-4 fill-black" viewBox="0 0 24 24">
                                    <rect x="6" y="4" width="4" height="16" rx="1" />
                                    <rect x="14" y="4" width="4" height="16" rx="1" />
                                  </svg>
                                ) : (
                                  <svg className="w-4 h-4 fill-black" viewBox="0 0 24 24">
                                    <polygon points="5,3 19,12 5,21" />
                                  </svg>
                                )}
                              </button>
                              
                              <div className="flex-1 space-y-1">
                                <input 
                                  type="range" 
                                  min="0" 
                                  max={isThisPlaying ? duration || 100 : 100}
                                  value={isThisPlaying ? currentTime : 0}
                                  onChange={isThisPlaying ? handleSeek : undefined}
                                  disabled={!isThisPlaying}
                                  className="w-full h-1.5 bg-neutral-800 rounded-lg appearance-none cursor-pointer accent-amber-500 disabled:opacity-40"
                                />
                                
                                <div className="flex justify-between text-[10px] font-mono text-neutral-400">
                                  <span>{isThisPlaying ? formatTime(currentTime) : "0:00"}</span>
                                  <span>{isThisPlaying && duration ? formatTime(duration) : "Prévia"}</span>
                                </div>
                              </div>
                            </div>
                          </div>
                        ) : (
                          <div className="bg-neutral-950 border border-amber-900/30 p-4 rounded-xl text-center space-y-3">
                            <p className="text-xs text-amber-200/80 font-medium leading-relaxed">
                              {idx === 1
                                ? "Decifre o primeiro Enigma para revelar The Guardian of Hidden Wisdom!"
                                : idx === 2
                                  ? "Compreenda o segredo do Guardião para revelar o portal de Raining Tears!"
                                  : "Atravesse Raining Tears e decifre o último Enigma para liberar Dark Clouds!"}
                            </p>
                            <button 
                              onClick={() => setActiveRiddle(idx === 1 ? 'riddle1' : idx === 2 ? 'riddle2' : 'riddle3')}
                              className="w-full bg-gradient-to-r from-amber-600 to-amber-500 hover:from-amber-500 hover:to-amber-400 text-black font-extrabold text-xs py-2.5 rounded-xl transition shadow-lg shadow-amber-950/50 flex items-center justify-center gap-2 uppercase tracking-wider"
                            >
                              <i data-lucide="key" className="w-4 h-4"></i>
                              <span>Decifrar Enigma</span>
                            </button>
                          </div>
                        )}
                      </div>
                    </div>

                    <div className="p-4 pt-0 space-y-2">
                      {isUnlocked ? (
                        <a 
                          href={isRegistered ? track.downloadFile : "#vip"}
                          download={isRegistered ? `${track.title}.mp3` : undefined}
                          onClick={() => handleTrackDownloadClick(track.id)}
                          className={`w-full py-2.5 rounded-xl font-bold text-xs flex items-center justify-center gap-2 transition ${
                            isRegistered 
                              ? 'bg-neutral-100 hover:bg-white text-black' 
                              : 'bg-neutral-800 hover:bg-neutral-700 text-neutral-300 border border-neutral-700'
                          }`}
                        >
                          <i data-lucide={isRegistered ? "download" : "lock"} className="w-4 h-4"></i>
                          <span>{isRegistered ? 'Baixar Música (.MP3)' : 'Desbloquear Download Grátis'}</span>
                        </a>
                      ) : (
                        <div className="py-2.5 text-center text-xs text-neutral-600 font-mono italic">
                          🔒 Conteúdo Bloqueado
                        </div>
                      )}

                      <a 
                        href="#support" 
                        className="w-full py-2 rounded-xl font-bold text-xs bg-transparent hover:bg-neutral-800/80 text-neutral-400 hover:text-white border border-neutral-800 flex items-center justify-center gap-2 transition"
                      >
                        <i data-lucide="handshake" className="w-4 h-4 text-amber-500"></i>
                        <span>Apoiar Projeto PASSARO</span>
                      </a>
                    </div>
                  </div>
                );
              })}
            </div>
          </section>

          {/* VIP Fan Area */}
          <section id="vip" ref={vipSectionRef} className="max-w-3xl mx-auto my-12 px-4">
            <div className="bg-neutral-900 border border-neutral-800 rounded-2xl p-6 md:p-8 relative overflow-hidden">
              <div className="flex justify-between items-center mb-4">
                <div className="flex items-center gap-3">
                  <i data-lucide="music" className="text-amber-500 w-6 h-6"></i>
                  <h2 className="text-xl md:text-2xl font-bold">Comunidade PASSARO & Downloads VIP</h2>
                </div>
                <span className="text-xs bg-neutral-800 text-neutral-300 border border-neutral-700 px-3 py-1 rounded-full font-mono">
                  🔥 {activeFansCount} Active Fans
                </span>
              </div>

              {!isRegistered ? (
                <div className="space-y-4">
                  <p className="text-neutral-400 text-sm">
                    Preencha os dados abaixo para Desbloquear Downloads em MP3 de alta qualidade das faixas do projeto PASSARO.
                  </p>
                  
                  <form onSubmit={handleVipRegister} className="space-y-3 pt-2">
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                      <div>
                        <label className="text-[10px] font-bold text-neutral-400 uppercase tracking-wider block mb-1">Seu Nome *</label>
                        <input 
                          type="text" 
                          required
                          placeholder="Digite seu nome completo" 
                          value={vipName}
                          onChange={(e) => setVipName(e.target.value)}
                          className="w-full bg-neutral-950 border border-neutral-800 text-white px-4 py-2.5 rounded-xl focus:outline-none focus:border-amber-500 text-sm"
                        />
                      </div>

                      <div>
                        <label className="text-[10px] font-bold text-neutral-400 uppercase tracking-wider block mb-1">Cidade / País *</label>
                        <input 
                          type="text" 
                          required
                          placeholder="Ex: Londrina / Brasil" 
                          value={vipLocation}
                          onChange={(e) => setVipLocation(e.target.value)}
                          className="w-full bg-neutral-950 border border-neutral-800 text-white px-4 py-2.5 rounded-xl focus:outline-none focus:border-amber-500 text-sm"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                      <div>
                        <label className="text-[10px] font-bold text-neutral-400 uppercase tracking-wider block mb-1">E-mail *</label>
                        <input 
                          type="email" 
                          required
                          placeholder="Digite seu melhor e-mail" 
                          value={vipEmail}
                          onChange={(e) => setVipEmail(e.target.value)}
                          className="w-full bg-neutral-950 border border-neutral-800 text-white px-4 py-2.5 rounded-xl focus:outline-none focus:border-amber-500 text-sm"
                        />
                      </div>

                      <div>
                        <label className="text-[10px] font-bold text-neutral-400 uppercase tracking-wider block mb-1">Instagram (@usuario)</label>
                        <input 
                          type="text" 
                          placeholder="@passaroofficial" 
                          value={vipInstagram}
                          onChange={(e) => setVipInstagram(e.target.value)}
                          className="w-full bg-neutral-950 border border-neutral-800 text-white px-4 py-2.5 rounded-xl focus:outline-none focus:border-amber-500 text-sm"
                        />
                      </div>
                    </div>

                    <button 
                      type="submit" 
                      disabled={isSubmittingVip}
                      className="w-full bg-amber-500 hover:bg-amber-400 text-black font-extrabold px-6 py-3.5 rounded-xl transition text-sm flex items-center justify-center gap-2 disabled:opacity-50 mt-2 shadow-lg shadow-amber-950 uppercase tracking-wider"
                    >
                      <i data-lucide="unlock" className="w-4 h-4"></i>
                      <span>{isSubmittingVip ? 'Liberando Acesso VIP...' : 'Digitar e-mail para Desbloquear Downloads'}</span>
                    </button>
                  </form>
                </div>
              ) : (
                <div className="bg-neutral-950/80 border border-emerald-500/30 p-5 rounded-xl space-y-2">
                  <div className="flex items-center gap-2 text-emerald-400 font-bold text-sm">
                    <i data-lucide="user-check" className="w-5 h-5"></i> Acesso VIP PASSARO Ativado!
                  </div>
                  <p className="text-xs text-neutral-400">
                    Você já possui acesso VIP liberado. Escolha qualquer uma das músicas desbloqueadas nos cards acima para realizar o download direto do arquivo MP3.
                  </p>
                </div>
              )}
            </div>
          </section>

          {/* Support */}
          <section id="support" className="max-w-3xl mx-auto my-12 px-4 space-y-6">
            <div className="text-center space-y-3">
              <h2 className="text-2xl font-black uppercase tracking-tight">Apoie a Banda & Projeto PASSARO</h2>
              <p className="text-xs md:text-sm text-neutral-300 max-w-2xl mx-auto leading-relaxed font-light">
                O projeto PASSARO nasce do desejo de criar Heavy Metal verdadeiro, independente e com alma. Suas contribuições diretas nos ajudam a manter as produções no estúdio, novas composições e lançamentos de áudios em altíssima qualidade! Gratidão por fazer parte dessa jornada!
              </p>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div className="bg-neutral-900 border border-neutral-800 rounded-2xl p-6 flex flex-col justify-between space-y-4">
                <div className="space-y-2">
                  <div className="flex items-center gap-2 text-amber-500 font-bold text-sm">
                    <i data-lucide="coffee" className="w-5 h-5"></i> International Support
                  </div>
                  <h3 className="font-bold text-base text-white">Buy me a coffee on Ko-fi ☕</h3>
                  <p className="text-xs text-neutral-400">Apoio internacional para Marco Brandfer / PASSARO via Ko-fi.</p>
                </div>
                <a 
                  href={socialLinks.kofi} 
                  target="_blank" 
                  rel="noopener noreferrer"
                  className="w-full bg-amber-500 hover:bg-amber-400 text-black font-extrabold text-xs py-3 rounded-xl transition text-center flex items-center justify-center gap-2 uppercase tracking-wider"
                >
                  <span>Apoiar via Ko-fi</span>
                  <i data-lucide="external-link" className="w-4 h-4"></i>
                </a>
              </div>

              <div className="bg-neutral-900 border border-neutral-800 rounded-2xl p-6 flex flex-col justify-between space-y-4">
                <div className="space-y-2">
                  <div className="flex items-center gap-2 text-emerald-400 font-bold text-sm">
                    <i data-lucide="qr-code" className="w-5 h-5"></i> Apoio Nacional (Brasil)
                  </div>
                  <h3 className="font-bold text-base text-white">Contribuição via Pix 🇧🇷</h3>
                  <p className="text-xs text-neutral-400">Copie a chave Pix abaixo para apoiar diretamente o projeto.</p>
                </div>
                
                <div className="space-y-2">
                  <div className="bg-neutral-950 border border-neutral-800 px-3 py-2 rounded-lg text-xs font-mono text-neutral-300 truncate">
                    {pixKey}
                  </div>
                  <button 
                    onClick={copyPixToClipboard}
                    className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs py-2.5 rounded-xl transition flex items-center justify-center gap-2"
                  >
                    <i data-lucide={copiedPix ? "check" : "copy"} className="w-4 h-4"></i>
                    <span>{copiedPix ? 'Chave Pix Copiada!' : 'Copiar Chave Pix'}</span>
                  </button>
                </div>
              </div>
            </div>

            <div className="bg-neutral-900 border border-neutral-800 rounded-2xl p-6 text-center space-y-4">
              <p className="text-xs md:text-sm font-semibold text-neutral-300">
                Espalhe a palavra! Compartilhe o Web App do projeto PASSARO com outros amantes de Heavy Metal:
              </p>
              <button 
                onClick={handleShareApp} 
                className="bg-amber-500 hover:bg-amber-400 text-black font-black px-6 py-3 rounded-xl text-xs uppercase tracking-wider transition flex items-center justify-center gap-2 mx-auto shadow-lg shadow-amber-950"
              >
                <i data-lucide={copiedShare ? "check" : "share-2"} className="w-4 h-4"></i>
                <span>{copiedShare ? 'Link Copiado!' : 'Compartilhar App PASSARO'}</span>
              </button>
            </div>
          </section>

          {/* Mural dos Fãs */}
          <section className="max-w-3xl mx-auto my-12 px-4">
            <div className="bg-neutral-900 border border-neutral-800 rounded-2xl p-6 md:p-8 space-y-6">
              <div className="flex items-center gap-3 border-b border-neutral-800 pb-4">
                <i data-lucide="message-square" className="text-amber-500 w-6 h-6"></i>
                <div>
                  <h2 className="text-xl font-bold">Mural dos Fãs & Comunidade PASSARO</h2>
                  <p className="text-xs text-neutral-400">Qual a sua faixa ou solo favorito até agora? Deixe sua mensagem abaixo!</p>
                </div>
              </div>

              <form onSubmit={handleAddComment} className="space-y-3">
                <input 
                  type="text" 
                  required
                  placeholder="Seu Nome ou Nick"
                  value={userName}
                  onChange={(e) => setUserName(e.target.value)}
                  className="w-full bg-neutral-950 border border-neutral-800 text-white px-4 py-2.5 rounded-xl focus:outline-none focus:border-amber-500 text-sm"
                />
                <textarea 
                  required
                  rows="3"
                  placeholder="Deixe seu comentário sobre as músicas, letras e enigmas..."
                  value={newComment}
                  onChange={(e) => setNewComment(e.target.value)}
                  className="w-full bg-neutral-950 border border-neutral-800 text-white px-4 py-2.5 rounded-xl focus:outline-none focus:border-amber-500 text-sm"
                ></textarea>
                <button 
                  type="submit" 
                  disabled={isSubmittingComment}
                  className="bg-amber-500 hover:bg-amber-400 text-black font-extrabold px-6 py-2.5 rounded-xl text-xs transition uppercase tracking-wider flex items-center gap-2 disabled:opacity-50"
                >
                  <i data-lucide="send" className="w-3.5 h-3.5"></i>
                  <span>{isSubmittingComment ? 'Enviando...' : 'Publicar Comentário'}</span>
                </button>
              </form>

              <div className="space-y-3 pt-2">
                {comments.length === 0 ? (
                  <p className="text-xs text-neutral-500 italic">Nenhum comentário ainda. Seja o primeiro a comentar!</p>
                ) : (
                  comments.map((item, index) => (
                    <div key={index} className="bg-neutral-950 p-4 rounded-xl border border-neutral-800/60 flex gap-3.5 items-start">
                      <div className="w-10 h-10 rounded-xl bg-neutral-900 border border-neutral-800 p-1 flex-shrink-0 overflow-hidden">
                        <img 
                          src={item.avatar || getRockAvatar(item.name)} 
                          alt={item.name} 
                          className="w-full h-full object-contain"
                        />
                      </div>
                      <div className="flex-1 space-y-1">
                        <div className="flex justify-between items-center">
                          <span className="font-bold text-xs text-amber-400">{item.name}</span>
                          <span className="text-[10px] text-neutral-500">{item.date}</span>
                        </div>
                        <p className="text-xs text-neutral-300 leading-relaxed">{item.text}</p>
                      </div>
                    </div>
                  ))
                )}
              </div>
            </div>
          </section>

          {/* SEÇÃO OFICIAL DE CAMISETAS */}
          <CamisetaSection />

          {/* Footer */}
          <footer className="max-w-4xl mx-auto mt-16 px-4 pt-8 border-t border-neutral-800 text-center space-y-6">
            <div className="flex justify-center items-center gap-8 flex-wrap">
              <a href={socialLinks.instagram} target="_blank" rel="noopener noreferrer" className="text-neutral-400 hover:text-white transition flex items-center gap-2 text-xs font-bold">
                <i data-lucide="instagram" className="w-5 h-5 text-amber-500"></i> @passaroofficial
              </a>

              <a href={socialLinks.youtube} target="_blank" rel="noopener noreferrer" className="text-neutral-400 hover:text-red-500 transition flex items-center gap-2 text-xs font-bold">
                <i data-lucide="youtube" className="w-5 h-5 text-red-500"></i> YouTube (@Brandfer)
              </a>

              <a href={socialLinks.kofi} target="_blank" rel="noopener noreferrer" className="text-neutral-400 hover:text-amber-400 transition flex items-center gap-2 text-xs font-bold">
                <i data-lucide="coffee" className="w-5 h-5 text-amber-500"></i> Ko-fi
              </a>
            </div>

            <p className="text-xs text-neutral-500">© 2026 PASSARO • Created & Produced by Marco Brandfer. All rights reserved.</p>
          </footer>

          {/* MODAL DE LETRAS & TRADUÇÃO */}
          {selectedLyricsTrack && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-neutral-900 border border-neutral-800 w-full max-w-xl rounded-2xl overflow-hidden flex flex-col max-h-[85vh] shadow-2xl">
                
                <div className="p-4 bg-neutral-950 border-b border-neutral-800 flex justify-between items-center">
                  <div className="flex items-center gap-3">
                    <img 
                      src={selectedLyricsTrack.cover} 
                      alt={selectedLyricsTrack.title} 
                      className="w-10 h-10 rounded-lg object-cover border border-neutral-800"
                    />
                    <div>
                      <h3 className="font-bold text-sm text-white">{selectedLyricsTrack.title}</h3>
                      <p className="text-[10px] text-neutral-400 uppercase font-mono tracking-wider">{selectedLyricsTrack.subtitle}</p>
                    </div>
                  </div>

                  <button 
                    onClick={() => setSelectedLyricsTrack(null)}
                    className="text-neutral-400 hover:text-white p-1 rounded-lg bg-neutral-900 border border-neutral-800 transition"
                  >
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                <div className="px-4 py-3 bg-neutral-900 border-b border-neutral-800 flex justify-between items-center gap-2">
                  <div className="flex gap-2">
                    <button 
                      onClick={() => setLyricsLang('en')}
                      className={`text-xs px-3 py-1.5 rounded-lg font-bold border transition ${
                        lyricsLang === 'en' 
                          ? 'bg-amber-500 text-black border-amber-400 font-extrabold' 
                          : 'bg-neutral-950 text-neutral-400 border-neutral-800 hover:text-white'
                      }`}
                    >
                      🇬🇧 Original (EN)
                    </button>
                    <button 
                      onClick={() => setLyricsLang('pt')}
                      className={`text-xs px-3 py-1.5 rounded-lg font-bold border transition ${
                        lyricsLang === 'pt' 
                          ? 'bg-amber-500 text-black border-amber-400 font-extrabold' 
                          : 'bg-neutral-950 text-neutral-400 border-neutral-800 hover:text-white'
                      }`}
                    >
                      🇧🇷 Tradução (PT-BR)
                    </button>
                  </div>

                  <button 
                    onClick={copyLyricsToClipboard}
                    className="text-xs text-neutral-300 hover:text-white bg-neutral-950 border border-neutral-800 px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition"
                  >
                    <i data-lucide={copiedLyrics ? "check" : "copy"} className="w-3.5 h-3.5 text-amber-500"></i>
                    <span>{copiedLyrics ? 'Copiado!' : 'Copiar'}</span>
                  </button>
                </div>

                <div className="p-6 overflow-y-auto font-mono text-sm leading-relaxed text-neutral-300 whitespace-pre-line bg-neutral-950/50">
                  {selectedLyricsTrack.lyrics[lyricsLang]}
                </div>

                <div className="p-4 bg-neutral-950 border-t border-neutral-800 text-center">
                  <button 
                    onClick={() => setSelectedLyricsTrack(null)}
                    className="w-full bg-neutral-800 hover:bg-neutral-700 text-white text-xs font-bold py-2.5 rounded-xl transition"
                  >
                    Fechar
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* MODAL ENIGMA #1 */}
          {activeRiddle === 'riddle1' && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-neutral-900 border border-amber-500/40 w-full max-w-lg rounded-2xl p-6 space-y-5 shadow-2xl">
                <div className="flex justify-between items-center border-b border-neutral-800 pb-3">
                  <span className="text-xs font-bold uppercase text-amber-500 flex items-center gap-2">
                    <i data-lucide="shield-alert" className="w-4 h-4"></i> Enigma de Desbloqueio #1
                  </span>
                  <button onClick={closeRiddleModal} className="text-neutral-400 hover:text-white">✕</button>
                </div>
                {!riddleSuccessText ? (
                  <form onSubmit={handleSolveRiddle1} className="space-y-4">
                    <p className="text-sm font-semibold text-neutral-200 leading-relaxed">
                      "Não sou a sabedoria, mas permaneço entre ela e aqueles que a procuram. Não sou a chave, mas decido quem pode cruzar a linha. Em silêncio, vigio aquilo que não deve ser entregue a qualquer um. Quem sou eu?"
                    </p>
                    <div className="space-y-2">
                      {[
                        { id: 'A', text: 'A) O próprio Portal' },
                        { id: 'B', text: 'B) O Guardião' },
                        { id: 'C', text: 'C) O Vento Antigo' },
                        { id: 'D', text: 'D) O Pergaminho' }
                      ].map((opt) => (
                        <label key={opt.id} className={`flex items-center gap-3 p-3 rounded-xl border text-xs cursor-pointer transition ${selectedOptionRiddle1 === opt.id ? 'bg-amber-950/60 border-amber-500 text-white font-bold' : 'bg-neutral-950 border-neutral-800 text-neutral-300 hover:border-neutral-700'}`}>
                          <input type="radio" name="riddle1" value={opt.id} checked={selectedOptionRiddle1 === opt.id} onChange={(e) => setSelectedOptionRiddle1(e.target.value)} className="accent-amber-500" />
                          <span>{opt.text}</span>
                        </label>
                      ))}
                    </div>
                    {riddleError && <p className="text-xs text-red-500 font-bold">{riddleError}</p>}
                    <button type="submit" disabled={!selectedOptionRiddle1} className="w-full bg-amber-500 hover:bg-amber-400 text-black font-extrabold py-3 rounded-xl text-xs uppercase tracking-wider transition disabled:opacity-50">
                      Quebrar o Primeiro Selo
                    </button>
                  </form>
                ) : (
                  <div className="space-y-4 text-center">
                    <div className="w-12 h-12 bg-amber-500/20 text-amber-500 rounded-full flex items-center justify-center mx-auto text-2xl">🔓</div>
                    <h3 className="font-extrabold text-lg text-white uppercase">Selo Quebrado!</h3>
                    <p className="text-xs text-neutral-300 leading-relaxed bg-neutral-950 p-4 rounded-xl border border-neutral-800">"{riddleSuccessText}"</p>
                    <button onClick={closeRiddleModal} className="w-full bg-amber-500 hover:bg-amber-400 text-black font-extrabold py-3 rounded-xl text-xs uppercase transition">Ouvir The Guardian Agora</button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* MODAL ENIGMA #2 */}
          {activeRiddle === 'riddle2' && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-neutral-900 border border-amber-500/40 w-full max-w-lg rounded-2xl p-6 space-y-5 shadow-2xl">
                <div className="flex justify-between items-center border-b border-neutral-800 pb-3">
                  <span className="text-xs font-bold uppercase text-amber-500 flex items-center gap-2"><i data-lucide="shield-alert" className="w-4 h-4"></i> Enigma de Desbloqueio #2</span>
                  <button onClick={closeRiddleModal} className="text-neutral-400 hover:text-white">✕</button>
                </div>
                {!riddleSuccessText ? (
                  <form onSubmit={handleSolveRiddle2} className="space-y-4">
                    <p className="text-sm font-semibold text-neutral-200 leading-relaxed">
                      "Nas sombras profundas, ele guarda a sabedoria que a humanidade esqueceu. 'He is the watchmen!' Mas o que o Guardião realmente protege em suas mãos?"
                    </p>
                    <div className="space-y-2">
                      {[
                        { id: 'A', text: 'A) Uma espada de ouro' },
                        { id: 'B', text: 'B) Pergaminhos Antigos (The Scrolls of Old)' },
                        { id: 'C', text: 'C) Uma coroa de prata' },
                        { id: 'D', text: 'D) O Trono de Ferro' }
                      ].map((opt) => (
                        <label key={opt.id} className={`flex items-center gap-3 p-3 rounded-xl border text-xs cursor-pointer transition ${selectedOptionRiddle2 === opt.id ? 'bg-amber-950/60 border-amber-500 text-white font-bold' : 'bg-neutral-950 border-neutral-800 text-neutral-300 hover:border-neutral-700'}`}>
                          <input type="radio" name="riddle2" value={opt.id} checked={selectedOptionRiddle2 === opt.id} onChange={(e) => setSelectedOptionRiddle2(e.target.value)} className="accent-amber-500" />
                          <span>{opt.text}</span>
                        </label>
                      ))}
                    </div>
                    {riddleError && <p className="text-xs text-red-500 font-bold">{riddleError}</p>}
                    <button type="submit" disabled={!selectedOptionRiddle2} className="w-full bg-amber-500 hover:bg-amber-400 text-black font-extrabold py-3 rounded-xl text-xs uppercase tracking-wider transition disabled:opacity-50">Quebrar o Segundo Selo</button>
                  </form>
                ) : (
                  <div className="space-y-4 text-center">
                    <div className="w-12 h-12 bg-amber-500/20 text-amber-500 rounded-full flex items-center justify-center mx-auto text-2xl">🔓</div>
                    <h3 className="font-extrabold text-lg text-white uppercase">Selo Quebrado!</h3>
                    <p className="text-xs text-neutral-300 leading-relaxed bg-neutral-950 p-4 rounded-xl border border-neutral-800">"{riddleSuccessText}"</p>
                    <button onClick={closeRiddleModal} className="w-full bg-amber-500 hover:bg-amber-400 text-black font-extrabold py-3 rounded-xl text-xs uppercase transition">Ouvir Raining Tears Agora</button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* MODAL ENIGMA #3 */}
          {activeRiddle === 'riddle3' && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-neutral-900 border border-amber-500/40 w-full max-w-lg rounded-2xl p-6 space-y-5 shadow-2xl">
                <div className="flex justify-between items-center border-b border-neutral-800 pb-3">
                  <span className="text-xs font-bold uppercase text-amber-500 flex items-center gap-2"><i data-lucide="shield-alert" className="w-4 h-4"></i> Enigma de Desbloqueio #3</span>
                  <button onClick={closeRiddleModal} className="text-neutral-400 hover:text-white">✕</button>
                </div>
                {!riddleSuccessText ? (
                  <form onSubmit={handleSolveRiddle3} className="space-y-4">
                    <p className="text-sm font-semibold text-neutral-200 leading-relaxed">
                      "Depois de testemunhar um mundo afogado em lágrimas, existe uma verdade que nenhum Guardião pode revelar por você. Quem precisa enxergar além das sombras para que a sabedoria realmente desperte?"
                    </p>
                    <div className="space-y-2">
                      {[
                        { id: 'A', text: 'A) Um rei acima dos homens' },
                        { id: 'B', text: 'B) O próprio Portal' },
                        { id: 'C', text: 'C) Você — o ouvinte e a sua consciência' },
                        { id: 'D', text: 'D) Uma antiga profecia' }
                      ].map((opt) => (
                        <label key={opt.id} className={`flex items-center gap-3 p-3 rounded-xl border text-xs cursor-pointer transition ${selectedOptionRiddle3 === opt.id ? 'bg-amber-950/60 border-amber-500 text-white font-bold' : 'bg-neutral-950 border-neutral-800 text-neutral-300 hover:border-neutral-700'}`}>
                          <input type="radio" name="riddle3" value={opt.id} checked={selectedOptionRiddle3 === opt.id} onChange={(e) => setSelectedOptionRiddle3(e.target.value)} className="accent-amber-500" />
                          <span>{opt.text}</span>
                        </label>
                      ))}
                    </div>
                    {riddleError && <p className="text-xs text-red-500 font-bold">{riddleError}</p>}
                    <button type="submit" disabled={!selectedOptionRiddle3} className="w-full bg-amber-500 hover:bg-amber-400 text-black font-extrabold py-3 rounded-xl text-xs uppercase tracking-wider transition disabled:opacity-50">Quebrar o Terceiro Selo</button>
                  </form>
                ) : (
                  <div className="space-y-4 text-center">
                    <div className="w-12 h-12 bg-amber-500/20 text-amber-500 rounded-full flex items-center justify-center mx-auto text-2xl">⚡</div>
                    <h3 className="font-extrabold text-lg text-white uppercase">Acesso Concedido!</h3>
                    <p className="text-xs text-neutral-300 leading-relaxed bg-neutral-950 p-4 rounded-xl border border-neutral-800">"{riddleSuccessText}"</p>
                    <button onClick={closeRiddleModal} className="w-full bg-amber-500 hover:bg-amber-400 text-black font-extrabold py-3 rounded-xl text-xs uppercase transition">Ouvir Dark Clouds Agora</button>
                  </div>
                )}
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<PassaroApp />);
  </script>
</body>
</html>
